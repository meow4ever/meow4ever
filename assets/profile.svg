<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="meow4ever terminal profile card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>

    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#008C45"/>
      <stop offset="50%" stop-color="#F4F5F0"/>
      <stop offset="100%" stop-color="#CD212A"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#484f58"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>

    <clipPath id="t1"><rect x="32" y="66" width="0" height="28"><animate attributeName="width" from="0" to="252" begin="0.3s" dur="0.85s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="32" y="132" width="0" height="28"><animate attributeName="width" from="0" to="342" begin="2.1s" dur="1.05s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="32" y="198" width="0" height="28"><animate attributeName="width" from="0" to="288" begin="4.0s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="32" y="264" width="0" height="28"><animate attributeName="width" from="0" to="342" begin="5.8s" dur="1.05s" fill="freeze"/></rect></clipPath>
    <clipPath id="card"><rect x="1" y="1" width="878" height="398" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="880" height="400" fill="url(#bg)"/>
    <rect x="0" y="0" width="880" height="400" fill="url(#glow)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="880" height="40" fill="#161b22"/>
    <circle cx="28" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="20" r="6" fill="#27c93f"/>
    <text x="440" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#484f58" letter-spacing="1.5">meow4ever — bash — 80×24</text>

    <!-- tricolore divider -->
    <rect x="0" y="40" width="880" height="3" fill="url(#tri)"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
      <!-- line 1 -->
      <g clip-path="url(#t1)">
        <text x="32" y="90">
          <tspan fill="#00E676">meow4ever@italy</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$ </tspan><tspan fill="#F0F6FC">whoami</tspan>
        </text>
      </g>
      <text x="32" y="118" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.25s" dur="0.4s" fill="freeze"/>
        <tspan fill="#F0F6FC" font-weight="700">Kovak</tspan><tspan fill="#8B949E"> — reverse engineer &amp; systems developer</tspan>
      </text>

      <!-- line 2 -->
      <g clip-path="url(#t2)">
        <text x="32" y="156">
          <tspan fill="#00E676">meow4ever@italy</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$ </tspan><tspan fill="#F0F6FC">cat location.txt</tspan>
        </text>
      </g>
      <text x="32" y="184" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.25s" dur="0.4s" fill="freeze"/>
        <tspan fill="#F0F6FC">Italy</tspan><tspan fill="#8B949E">  ·  UTC+1  ·  italiano / english</tspan>
      </text>

      <!-- line 3 -->
      <g clip-path="url(#t3)">
        <text x="32" y="222">
          <tspan fill="#00E676">meow4ever@italy</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$ </tspan><tspan fill="#F0F6FC">ls focus/</tspan>
        </text>
      </g>
      <text x="32" y="250" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.4s" fill="freeze"/>
        <tspan fill="#58A6FF">native-code/</tspan><tspan fill="#8B949E">  </tspan><tspan fill="#58A6FF">game-internals/</tspan><tspan fill="#8B949E">  </tspan><tspan fill="#58A6FF">uefi/</tspan><tspan fill="#8B949E">  </tspan><tspan fill="#58A6FF">binary-analysis/</tspan>
      </text>

      <!-- line 4 -->
      <g clip-path="url(#t4)">
        <text x="32" y="288">
          <tspan fill="#00E676">meow4ever@italy</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$ </tspan><tspan fill="#F0F6FC">./status --check</tspan>
        </text>
      </g>
      <text x="32" y="316" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="6.95s" dur="0.4s" fill="freeze"/>
        <tspan fill="#00E676">[ ACTIVE ]</tspan><tspan fill="#8B949E"> reading what wasn't meant to be read</tspan>
      </text>

      <!-- cursor prompt -->
      <text x="32" y="366" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="7.6s" dur="0.3s" fill="freeze"/>
        <tspan fill="#00E676">meow4ever@italy</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$ </tspan>
      </text>
      <rect x="205" y="352" width="9" height="17" fill="#00E676" opacity="0">
        <animate attributeName="opacity" from="0" to="0" begin="0s" dur="0.01s" fill="freeze"/>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" begin="7.7s" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="879" height="399" rx="12" fill="none" stroke="url(#border)" stroke-width="1"/>
</svg>
