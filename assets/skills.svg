        <rect x="216" y="220" width="114" height="30" rx="15"/>
        <rect x="340" y="220" width="71" height="30" rx="15"/>
        <rect x="421" y="220" width="54" height="30" rx="15"/>
        <rect x="485" y="220" width="80" height="30" rx="15"/>
