<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356" role="img" aria-label="Tech stack and tools">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="stri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#008C45"/>
      <stop offset="50%" stop-color="#F4F5F0"/>
      <stop offset="100%" stop-color="#CD212A"/>
    </linearGradient>
    <clipPath id="scard"><rect x="1" y="1" width="878" height="354" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#scard)">
    <rect x="0" y="0" width="880" height="356" fill="url(#sbg)"/>
    <rect x="0" y="0" width="880" height="3" fill="url(#stri)"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">

      <!-- LANGUAGES -->
      <text x="32" y="48" font-size="11" font-weight="700" fill="#00E676" letter-spacing="2">LANGUAGES</text>
      <g fill="#161b22" stroke="#30363d" stroke-width="1">
        <rect x="32" y="60" width="54" height="30" rx="15"/>
        <rect x="96" y="60" width="45" height="30" rx="15"/>
        <rect x="151" y="60" width="62" height="30" rx="15"/>
        <rect x="223" y="60" width="54" height="30" rx="15"/>
        <rect x="287" y="60" width="80" height="30" rx="15"/>
        <rect x="377" y="60" width="114" height="30" rx="15"/>
      </g>
      <g fill="#C9D1D9" font-size="12.5" text-anchor="middle">
