        <rect x="130" y="140" width="80" height="30" rx="15"/>
        <rect x="220" y="140" width="80" height="30" rx="15"/>
        <rect x="310" y="140" width="71" height="30" rx="15"/>
        <rect x="391" y="140" width="62" height="30" rx="15"/>
